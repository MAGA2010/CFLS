services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: cfls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cfls
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cfls_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfls -d cfls"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      NODE_ENV: ${NODE_ENV:-local}
      PORT: 3000
      DATABASE_URL: postgresql://cfls:${POSTGRES_PASSWORD}@postgres:5432/cfls
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:5173}
      INQUIRY_ENABLED: ${INQUIRY_ENABLED:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SESSION_IDLE_TTL_MIN: ${SESSION_IDLE_TTL_MIN:-120}
      SESSION_ABSOLUTE_TTL_MIN: ${SESSION_ABSOLUTE_TTL_MIN:-720}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-120}
      RATE_LIMIT_INQUIRY: ${RATE_LIMIT_INQUIRY:-5}
      TRUST_REQUEST_ID: ${TRUST_REQUEST_ID:-false}
      INQUIRY_IDEMPOTENCY_TTL_H: ${INQUIRY_IDEMPOTENCY_TTL_H:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cfls_pgdata:
